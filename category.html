<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">تصنيف المنتجات - Lorin 🌸</title>
    <link rel="stylesheet" href="base.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fcfcfc; margin: 0; padding: 0; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; padding: 40px 0; }
        .product-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.04); transition: transform 0.3s ease; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { width: 100%; height: 280px; object-fit: cover; }
        .product-card-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .product-card-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 0; }
        .product-card-price { font-size: 16px; color: #e74c3c; font-weight: bold; }
        .section-title { text-align: center; font-size: 28px; color: #2c3e50; margin-top: 40px; }
    </style>
</head>
<body>

<!-- الهيدر مع شعار Lorin -->
<header class="header-wrapper color-scheme" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #eee;">
  <div>
    <a href="index.html">
      <img src="https://dptincirgzfwrlrpxajl.supabase.co/storage/v1/object/public/store-assets/categories/lll.png" alt="Lorin" style="height: 40px; object-fit: contain;">
    </a>
  </div>
  <div>
    <a href="index.html" style="background: #00313C; color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px;">الرئيسية 🏠</a>
  </div>
</header>

<!-- محتوى التصنيف -->
<main class="container">
    <h2 id="category-heading" class="section-title">جاري تحميل المنتجات... 🌸</h2>
    <div id="category-products-grid" class="products-grid">
        <!-- المنتجات ستظهر هنا ديناميكياً -->
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://dptincirgzfwrlrpxajl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DbYCExpNFypVQARATbdeVw_hipYS1Oa';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadCategoryProducts() {
        const urlParams = new URLSearchParams(window.location.search);
        const categoryName = urlParams.get('name');
        const headingEl = document.getElementById('category-heading');
        const gridContainer = document.getElementById('category-products-grid');

        if (!categoryName) {
            headingEl.textContent = "التصنيف غير محدد ⚠️";
            gridContainer.innerHTML = '<p style="text-align:center; color:red; grid-column: 1 / -1;">لم يتم العثور على التصنيف المطلوب.</p>';
            return;
        }

        // تحديث عنوان الصفحة واسم العرض
        document.getElementById('page-title').textContent = `${categoryName} - Lorin 🌸`;
        headingEl.textContent = `منتجات تصنيف: ${categoryName} 🌸`;

        try {
            // جلب المنتجات المطابقة لاسم التصنيف من قاعدة البيانات
            const { data: products, error } = await supabaseClient
                .from('products')
                .select('*')
                .ilike('category', `%${categoryName}%`);

            if (error) throw error;

            if (!products || products.length === 0) {
                gridContainer.innerHTML = '<p style="text-align:center; color:#888; grid-column: 1 / -1; padding: 40px;">لا توجد منتجات مضافة تحت هذا التصنيف حالياً.</p>';
                return;
            }

            gridContainer.innerHTML = products.map(p => `
                <a href="product.html?id=${p.id}" class="product-card">
                    <img src="${p.image_url || 'placeholder.jpg'}">
                    <div class="product-card-info">
                        <h3 class="product-card-title">${p.name}</h3>
                        <div class="product-card-price">${p.price} د.أ</div>
                    </div>
                </a>`).join('');

        } catch (err) {
            console.error(err);
            gridContainer.innerHTML = '<p style="text-align:center; color:red; grid-column: 1 / -1;">حدث خطأ أثناء جلب المنتجات.</p>';
        }
    }

    window.onload = loadCategoryProducts;
</script>
</body>
</html>
